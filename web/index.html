<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#06080b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Assistant</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-state="idle" data-mode="voice">
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="brand-name" id="brandName">—</span>
        <span class="brand-status" id="status">Offline</span>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </header>

    <main class="stage">
      <button class="orb" id="orb" aria-label="Talk">
        <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
        <span class="core"></span>
      </button>
      <p class="caption" id="caption">Tap to talk</p>
      <section class="log" id="log" aria-live="polite"></section>
    </main>

    <footer class="dock">
      <div class="voice-dock">
        <button class="pill" id="handsFreeBtn" aria-pressed="false" title="Keep listening after each reply">
          <span class="dot"></span>Hands-free
        </button>
        <button class="mic" id="micBtn" aria-label="Talk">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button class="pill" id="toTextBtn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>Type
        </button>
      </div>

      <form class="text-dock" id="textForm" autocomplete="off">
        <div class="attachments" id="attachments"></div>
        <div class="text-row">
          <button type="button" class="icon-btn" id="toVoiceBtn" aria-label="Back to voice">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          </button>
          <label class="icon-btn" aria-label="Attach image">
            <input type="file" id="fileInput" accept="image/*" multiple hidden>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>
          </label>
          <textarea id="textInput" rows="1" placeholder="Message…" enterkeyhint="send"></textarea>
          <button type="submit" class="send" aria-label="Send">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </form>
    </footer>
  </div>

  <!-- Access code -->
  <div class="overlay" id="lock" hidden>
    <form class="card" id="lockForm">
      <h1 id="lockTitle">Identify yourself</h1>
      <p class="muted">Enter the access code from your server's <code>.env</code>.</p>
      <input type="password" id="codeInput" placeholder="Access code" autocomplete="current-password" required>
      <p class="error" id="lockError"></p>
      <button class="primary" type="submit">Unlock</button>
    </form>
  </div>

  <!-- Settings -->
  <div class="overlay sheet-wrap" id="settings" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <h2>Settings</h2>
        <button class="icon-btn" id="closeSettings" aria-label="Close">✕</button>
      </div>

      <h3>Voice</h3>
      <p class="muted" id="voiceNote"></p>
      <label class="field">Browser voice
        <select id="voiceSelect"></select>
      </label>
      <label class="field">Pitch <span id="pitchVal"></span>
        <input type="range" id="pitch" min="0.5" max="1.3" step="0.05">
      </label>
      <label class="field">Speed <span id="rateVal"></span>
        <input type="range" id="rate" min="0.7" max="1.4" step="0.05">
      </label>
      <button class="ghost" id="testVoice">Test voice</button>
      <label class="toggle"><input type="checkbox" id="speakText"> Read replies aloud in text mode too</label>

      <h3>Memory</h3>
      <p class="muted">Things it has learned about you. Remove anything that's wrong.</p>
      <ul class="facts" id="facts"></ul>

      <h3>Session</h3>
      <button class="ghost" id="clearHistory">Clear conversation history</button>
      <button class="ghost" id="lockBtn">Lock this device</button>
    </div>
  </div>

  <audio id="player" playsinline></audio>
  <script src="app.js"></script>
</body>
</html>
